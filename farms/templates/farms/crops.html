{% extends "farms/base.html" %}

{% block title %}Crops Management{% endblock %}

{% block content %}
<div class="crops-page">
    <h1>Crops Management</h1>
    
    <div class="toolbar">
        <select id="farmFilter" class="filter-select">
            <option value="">All Farms</option>
        </select>
        <button class="btn btn-primary" onclick="showAddCropModal()">Add New Crop</button>
    </div>

    <div id="cropsTable" class="data-table"></div>
</div>

<!-- Add Crop Modal -->
<div id="addCropModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeAddCropModal()">&times;</span>
        <h2>Add New Crop</h2>
        <form id="addCropForm">
            <div class="form-group">
                <label for="cropFarm">Farm:</label>
                <select id="cropFarm" name="farm" required></select>
            </div>
            <div class="form-group">
                <label for="cropName">Crop Name:</label>
                <input type="text" id="cropName" name="name" required>
            </div>
            <div class="form-group">
                <label for="cropVariety">Variety:</label>
                <input type="text" id="cropVariety" name="variety">
            </div>
            <div class="form-group">
                <label for="plantingDate">Planting Date:</label>
                <input type="date" id="plantingDate" name="planting_date" required>
            </div>
            <div class="form-group">
                <label for="harvestDate">Expected Harvest Date:</label>
                <input type="date" id="harvestDate" name="expected_harvest_date" required>
            </div>
            <div class="form-group">
                <label for="cropArea">Area (hectares):</label>
                <input type="number" step="0.01" id="cropArea" name="area_hectares" required>
            </div>
            <div class="form-group">
                <label for="quantityPlanted">Quantity Planted (kg):</label>
                <input type="number" step="0.01" id="quantityPlanted" name="quantity_planted" required>
            </div>
            <div class="form-group">
                <label for="cropStatus">Status:</label>
                <select id="cropStatus" name="status" required>
                    <option value="planted">Planted</option>
                    <option value="growing">Growing</option>
                    <option value="harvested">Harvested</option>
                    <option value="failed">Failed</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cropNotes">Notes:</label>
                <textarea id="cropNotes" name="notes"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Crop</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/crops.js"></script>
{% endblock %}
